<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - TTS Project</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/appearance.js"></script>
</head>
<body data-page="login">
  <main class="card">
    <h1>Log in</h1>
    <div id="message" class="message" hidden role="alert"></div>
    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <p class="switch">No account yet? <a href="register.html">Register</a></p>
    <div id="appearance-panel"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
