<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - TTS Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <main class="card">
    <h1>Register</h1>
    <div id="message" class="message" hidden role="alert"></div>
    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password (min 6 characters)</label>
      <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required minlength="6" autocomplete="new-password">
      <button type="submit">Create account</button>
    </form>
    <p class="switch">Already registered? <a href="index.html">Log in</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
