<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App - TTS Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- hidden until auth.js confirms there is a valid, enabled session -->
<body data-page="app" hidden>
  <main class="card wide">
    <header class="topbar">
      <h1>TTS Project</h1>
      <div class="userbox">
        <span><strong id="user-email"></strong> (<span id="user-role"></span>)</span>
        <a id="admin-link" class="button secondary" href="admin.html" hidden>Admin Dashboard</a>
        <button id="logout-btn" type="button" class="secondary">Log out</button>
      </div>
    </header>

    <section aria-labelledby="gen-title">
      <h2 id="gen-title">Text to speech</h2>

      <div class="row">
        <div class="field">
          <label for="language">Language</label>
          <select id="language"></select>
        </div>
        <div class="field">
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>
      </div>

      <label for="text">Text to speak</label>
      <textarea id="text" rows="6" maxlength="1000" placeholder="Type or paste the text here, in the language you chose."></textarea>
      <p class="counter" id="counter" aria-live="polite">0 / 1000 characters · 0 words</p>

      <div class="actions">
        <button id="generate-btn" type="button" disabled>Generate Speech</button>
        <button id="clear-btn" type="button" class="secondary">Clear</button>
      </div>

      <div id="message" class="message" hidden role="alert"></div>
    </section>

    <section aria-labelledby="player-title">
      <h2 id="player-title">Player</h2>
      <!-- No native controls: our own buttons below control this element. -->
      <audio id="player" preload="auto"></audio>
      <div class="actions">
        <button id="play-btn" type="button" disabled>Play</button>
        <button id="pause-btn" type="button" disabled>Pause</button>
        <button id="resume-btn" type="button" disabled>Resume</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
        <a id="download-btn" class="button secondary" href="#" download="speech.mp3" hidden>Download MP3</a>
      </div>
      <div class="volume">
        <label for="volume">Volume: <span id="volume-value">100</span>%</label>
        <input id="volume" type="range" min="0" max="100" value="100">
      </div>
      <p class="hint" id="player-status">Generate speech to enable the player.</p>
    </section>

    <section aria-labelledby="history-title">
      <h2 id="history-title">Your history</h2>
      <p class="hint">Audio is not saved. To hear an old entry again, generate it again.</p>
      <div class="table-wrap">
        <table id="history-table">
          <thead>
            <tr><th>Date</th><th>Language</th><th>Voice</th><th>Chars</th><th>Status</th><th>Text</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <p class="hint" id="history-empty" hidden>No history yet.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tts.js"></script>
</body>
</html>
